name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn -B -DskipTests package

      - name: Stage release package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "dist/MCLand-${VERSION}"
          cp target/*.jar "dist/MCLand-${VERSION}/"
          cp LICENSE.txt README.md "dist/MCLand-${VERSION}/"
          tar -czf "dist/MCLand-${VERSION}.tar.gz" -C dist "MCLand-${VERSION}"
          cd dist
          sha256sum "MCLand-${VERSION}.tar.gz" "MCLand-${VERSION}"/* > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PACKAGE_BASENAME="MCLand-${TAG#v}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "dist/${PACKAGE_BASENAME}.tar.gz" "dist/${PACKAGE_BASENAME}"/* "dist/SHA256SUMS" \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" \
              "dist/${PACKAGE_BASENAME}.tar.gz" "dist/${PACKAGE_BASENAME}"/* "dist/SHA256SUMS" \
              --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
          fi
