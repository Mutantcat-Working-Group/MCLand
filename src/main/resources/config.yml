# ===== MCLand 插件配置 =====

# ===== 主城保护 =====
spawn-protection:
  # 受保护的世界名（世界不存在时保护自动禁用并输出告警日志）
  world: world
  # 保护半径（格，按水平距离计算）
  radius: 20

# ===== 清理掉落物 =====
item-clean:
  # 清理间隔（秒，15 分钟 = 900）
  interval-seconds: 900
  # 清理前通告：60 秒、30 秒各一次，最后 5 秒每秒通告

# ===== 清理生物 =====
animal-clean:
  # 清理间隔（秒）
  interval-seconds: 3600
  # 清理前通告：60 秒、30 秒各一次，最后 5 秒每秒通告
  # 玩家和村民（含流浪商人）永不清理；动物不会赶尽杀绝，只按下面的网格限额控制密度
  # 模糊网格边长（格）：按该边长的格子分桶统计，边界附近允许略有偏差，以换取最小资源消耗
  grid-size-blocks: 100
  # 每个网格内同种动物的上限，超出部分被移除
  max-per-type-per-grid: 2

# ===== 其他 =====
# 进服欢迎语（留空则不发送）
welcome-message: "[MCLand]欢迎来到方块猫窝！"
