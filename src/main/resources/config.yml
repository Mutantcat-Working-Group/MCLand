# ===== MCLand 插件配置 =====

# ===== 主城保护 =====
spawn-protection:
  # 受保护的世界名（世界不存在时保护自动禁用并输出告警日志）
  world: world
  # 保护半径（格，按水平距离计算；区域为以出生点为中心的正方形，该值即正方形半宽）
  radius: 20
  # 边界能量墙：把正方形边界渲染成蓝色半透明粒子墙，只发给附近玩家，可整体关闭
  wall:
    enabled: true
    # 水平可视距离（格）：只渲染玩家附近这段边界，越远越省资源
    view-distance-blocks: 24
    # 边界水平采样步长（格）
    horizontal-step-blocks: 2
    # 以玩家所在高度为中线，向上下延伸的格数
    vertical-range-blocks: 6
    # 纵向采样步长（格）
    vertical-step-blocks: 3
    # 刷新周期（ticks，20 ticks = 1 秒）
    period-ticks: 20
  # 怪物秒杀：进入区域的敌对生物直接击杀，且不掉落物品和经验（玩家自己击杀的正常掉落）
  guard:
    # 检查周期（ticks，越小反应越快，资源消耗越高）
    period-ticks: 10

# ===== 清理掉落物 =====
item-clean:
  # 清理间隔（秒，15 分钟 = 900）
  interval-seconds: 900
  # 清理前通告：60 秒、30 秒各一次，最后 5 秒每秒通告

# ===== 清理生物 =====
animal-clean:
  # 清理间隔（秒）
  interval-seconds: 3600
  # 清理前通告：60 秒、30 秒各一次，最后 5 秒每秒通告
  # 玩家和村民（含流浪商人）永不清理；动物不会赶尽杀绝，只按下面的网格限额控制密度
  # 模糊网格边长（格）：按该边长的格子分桶统计，边界附近允许略有偏差，以换取最小资源消耗
  grid-size-blocks: 100
  # 每个网格内同种动物的上限，超出部分被移除
  max-per-type-per-grid: 2

# ===== 注册登录 =====
auth:
  # 基岩版缓存登录：经间歇泉进来的基岩版玩家，缓存有效期内同一 IP 再次进服可免去手动 /login
  bedrock-session:
    enabled: true
    # 缓存有效时长（分钟），从上次成功登录那一刻算起
    window-minutes: 60

# ===== 交易系统 =====
# /sell 查看价目；/sell sum 计算当前手中物品总价；/sell sure 卖掉手中物品换取金币
# 可出售物品与单价：原石1、铜锭8、铁锭10、红石15、青金石20、绿宝石25、金锭50、钻石100（单位：金币）
# 价目表写在插件代码 sell/SellCommand.java 内，改价需重新编译；卖出后无法赎回

# ===== 整点红包 =====
# 奇数整点（1点、3点、5点……）服务器发出一个红包，金币总数随机 10-50
# 玩家输入 /red 随机抢 1-10 金币，每人每轮只能抢一次
# 本轮抢完或满一小时未抢完都会清零，清零之后再抢提示“红包已被抢完”
# 金额与发放规则写在插件代码 redpacket/RedPacketManager.java 内，调整需重新编译

# ===== 其他 =====
# 进服欢迎语（留空则不发送）
welcome-message: "[MCLand]欢迎来到方块猫窝！"
