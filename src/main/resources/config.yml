# ===== MCLand 插件配置 =====

# ===== 主城保护 =====
spawn-protection:
  # 受保护的世界名（世界不存在时保护自动禁用并输出告警日志）
  world: world
  # 保护半径（格，按水平距离计算）
  radius: 20

# ===== 清理掉落物 =====
item-clean:
  # 清理间隔（秒）
  interval-seconds: 1800
  # 清理前倒计时（秒）
  countdown-seconds: 5

# ===== 清理生物 =====
animal-clean:
  # 清理间隔（秒）
  interval-seconds: 3600
  # 清理前倒计时（秒）
  countdown-seconds: 5

# ===== 其他 =====
# 进服欢迎语（留空则不发送）
welcome-message: "欢迎来到Mutantcat Land！"
