name: MCLand
version: 26.2.20261005
main: org.mutantcat.mcland262.Main
api-version: 26.2
author: Mutantcat Working Group
softdepend:
  - floodgate
description: 方块猫窝公益服插件（主城保护与能量墙/死亡不掉落/定期清理/注册登录/传送请求/回城与home/金币系统/交易系统/帮助菜单/圈地系统）
commands:
  register:
    description: 注册当前用户名的密码
    usage: /register 密码 确认密码
  login:
    description: 登录当前用户名
    usage: /login 密码
  password:
    description: 修改当前账号密码
    usage: /password 密码 确认密码
  tp:
    description: 向指定玩家发送传送请求
    usage: /tp 玩家名
  accept:
    description: 接受收到的传送请求
    usage: /accept
  money:
    description: 查看金币余额，或/money give 转帐金币给他人（对方可不在线）
    usage: /money | /money give 数量 玩家名
  request:
    description: 向在线玩家索要金币，对方/accept且余额充足后到账
    usage: /request 数量 玩家名
  sell:
    description: 查看可出售物品与单价，出售手中物品换取金币，卖出后无法赎回
    usage: /sell | /sell sum | /sell sure
  red:
    description: 抢整点红包，随机获得金币（奇数整点发放，每人每轮一次）
    usage: /red
  spawn:
    description: 返回主城出生点
    usage: /spawn
  sethome:
    description: 把当前位置设为 home
    usage: /sethome
  home:
    description: 返回自己设置的 home
    usage: /home
  land:
    description: 圈地：木铲选点购买领地，whitelist 管理白名单，领地内仅主人与白名单可建造、破坏和交互
    usage: /land | /land sum | /land sure | /land off | /land whitelist add 玩家名
