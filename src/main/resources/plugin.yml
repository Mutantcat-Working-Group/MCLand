name: MCLand
version: 26.2.20260930
main: org.mutantcat.mcland262.Main
api-version: 26.2
author: Mutantcat Working Group
softdepend:
  - floodgate
description: 方块猫窝公益服插件（主城保护与能量墙/死亡不掉落/定期清理/注册登录/传送请求/回城与home/帮助菜单）
commands:
  register:
    description: 注册当前用户名的密码
    usage: /register 密码 确认密码
  login:
    description: 登录当前用户名
    usage: /login 密码
  password:
    description: 修改当前账号密码
    usage: /password 密码 确认密码
  tp:
    description: 向指定玩家发送传送请求
    usage: /tp 玩家名
  accept:
    description: 接受收到的传送请求
    usage: /accept
  spawn:
    description: 返回主城出生点
    usage: /spawn
  sethome:
    description: 把当前位置设为 home
    usage: /sethome
  home:
    description: 返回自己设置的 home
    usage: /home
